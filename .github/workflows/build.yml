name: Build EXE and APK

on:
  push:
    branches: [ main, beta, alpha, nightly, pre ]
  pull_request:
    branches: [ main, beta, alpha, nightly, pre ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          
      - name: Grant Execute Permission
        run: git update-index --chmod=+x gradlew
        
      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
        
      - name: Build Windows EXE
        run: ./gradlew :desktopApp:packageExe --stacktrace
        
      - name: Collect Artifacts
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/debug/*.apk dist/
          cp desktopApp/build/compose/binaries/main/exe/*.exe dist/
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omlet-arcade-builds
          path: dist/*

