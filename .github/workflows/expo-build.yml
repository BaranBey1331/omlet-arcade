name: Direct Android Build (Expo Prebuild)

on:
  push:
    branches: [ nightly ]
  pull_request:
    branches: [ nightly ]

jobs:
  build:
    name: Build Direct Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies (Optimized)
        run: npm ci
        
      - name: Generate Native Code (Prebuild)
        run: npx expo prebuild --clean --platform android
        
      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew
        
      - name: Build APK (Release - Optimized)
        run: cd android && ./gradlew assembleRelease --no-daemon --parallel --max-workers=4 -Porg.gradle.caching=true
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omlet-arcade-apk
          path: android/app/build/outputs/apk/release/*.apk
